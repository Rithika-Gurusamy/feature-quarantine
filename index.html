<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interviewer</title>
    <style>
        /* Base Page Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        /* Centered Workspace Container */
        .container {
            width: 100%;
            max-width: 680px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            padding: 32px;
        }

        /* Typography */
        h1 {
            color: #0f172a;
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 32px;
        }

        h2 {
            color: #1e3a8a;
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Form Layout Mechanics */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 8px;
        }

        /* Form Control Inputs */
        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #ffffff;
            color: #0f172a;
            font-size: 14px;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* File Upload Area styling */
        input[type="file"] {
            display: block;
            width: 100%;
            font-size: 14px;
            color: #64748b;
        }

        input[type="file"]::file-selector-button {
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 6px;
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 500;
            cursor: pointer;
            margin-right: 12px;
        }

        input[type="file"]::file-selector-button:hover {
            background-color: #e2e8f0;
        }

        /* Action Buttons */
        .btn-primary {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        /* Structural Divider */
        hr {
            border: 0;
            height: 1px;
            background-color: #e2e8f0;
            margin: 32px 0;
        }

        /* Active Chat Terminal styling */
        .chat-container {
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            background-color: #f8fafc;
            height: 350px;
            padding: 16px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .session-info {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 16px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            padding: 8px 12px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>AI Mock Interviewer</h1>
        <div class="subtitle">Stateful technical engineering assessment portal.</div>

        <!-- Setup Step Section -->
        <div id="setup-section">

            <div class="form-group">
                <label for="resume-file">Candidate Resume Artifact</label>
                <input type="file" id="resume-file" accept=".pdf">
            </div>

            <button type="button" class="btn-primary" id="upload-btn">Upload Resume and Start Interview</button>
        </div>

        <hr>





    </div>

</body>

</html>
