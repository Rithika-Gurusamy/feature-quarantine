<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mock Interviewer | Stateful Technical Assessment</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>
                    <span>AI Mock Interviewer</span>
                </h1>
                <div class="subtitle">Assessment</div>
            </div>
            <div id="connection-pill" class="status-pill">
                <span class="status-dot"></span>

            </div>
        </header>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="alert error" style="display: none;">
            <span id="alert-message"></span>
            <button type="button" class="btn-secondary" onclick="hideAlert()"
                style="padding: 2px 8px; font-size: 11px;">Dismiss</button>
        </div>

        <!-- Setup Step Section -->
        <div id="setup-section">
            <div class="form-group">
                <label for="resume-file">Candidate Resume Artifact (PDF)</label>
                <div class="file-upload-wrapper">
                    <input type="file" id="resume-file" accept=".pdf" onchange="onFileSelected(this)">
                </div>
            </div>

            <button type="button" class="btn-primary" id="upload-btn" onclick="startInterviewSession()">
                <span id="upload-btn-text">Upload Resume and Start Interview</span>
            </button>
        </div>

        <!-- Structured Profile Summary (Revealed after upload) -->
        <div id="profile-preview">
            <div class="profile-title">
                <span>Extracted Resume Profile</span>
            </div>
            <div id="profile-summary" class="profile-summary"></div>
            <div style="font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px;">Identified Key Skills:
            </div>
            <div id="profile-skills" class="skills-container"></div>
        </div>

        <!-- Active Chat Terminal -->
        <div id="chat-section">
            <div class="session-actions">
                <button type="button" class="btn-secondary" onclick="resetInterviewSession()">New Session</button>
            </div>

            <!-- Messages Window -->
            <div class="chat-container" id="chat-window">
                <!-- Messages appended dynamically by app.js -->
            </div>

            <!-- Input Bar -->
            <div class="input-bar">
                <textarea id="user-input" class="chat-input"
                    placeholder="Type your response to the Interviewer... (Press Enter to send, Shift+Enter for newline)"
                    rows="1" onkeydown="handleInputKeydown(event)" oninput="autoResizeTextarea(this)"></textarea>
                <button type="button" class="btn-send" id="send-btn" onclick="sendMessage()">
                    <span>Send</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </div>
            <div class="hint">Press <strong>Enter</strong> to submit your response. <strong>Shift + Enter</strong> adds
                a line break.</div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="/static/app.js"></script>
</body>

</html>
